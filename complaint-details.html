<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Details - SmartCity Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>SmartCity</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item" onclick="window.history.back()">← Back</a>
            <a href="profile.html" class="nav-item">Profile</a>
            <a href="#" class="nav-item" onclick="logout()">Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
            <div id="header-user-name" style="font-weight: 600;">Hello, User</div>
        </header>

        <div class="content-area">
            <h2 class="mb-3">Complaint Details</h2>

            <div class="card" id="details-container">
                <div class="flex justify-between align-center mb-2">
                    <h3 id="detail-title" style="margin:0;">Loading...</h3>
                    <span id="detail-status" class="badge"></span>
                </div>
                
                <p style="color: var(--text-muted); margin-bottom: 2rem;">Complaint ID: <strong id="detail-id"></strong></p>

                <!-- Status Timeline -->
                <div class="timeline">
                    <div class="timeline-step" id="tl-pending">Submitted<br><small>(Pending)</small></div>
                    <div class="timeline-step" id="tl-underreview">Under Review</div>
                    <div class="timeline-step" id="tl-inprogress">In Progress</div>
                    <div class="timeline-step" id="tl-resolved">Resolved</div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem;">
                    <div>
                        <p><strong>Category:</strong> <span id="detail-category"></span></p>
                        <p class="mt-2"><strong>Location:</strong> <span id="detail-location"></span></p>
                        <p class="mt-2"><strong>Date Submitted:</strong> <span id="detail-date"></span></p>
                    </div>
                    <div>
                        <p><strong>Description:</strong></p>
                        <p id="detail-description" style="margin-top: 0.5rem; background: #f9fafb; padding: 1rem; border-radius: 5px; border: 1px solid var(--border-color);"></p>
                    </div>
                </div>

                <!-- Admin Controls -->
                <div id="admin-controls" style="display: none; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
                    <h4>Admin Actions</h4>
                    <div class="flex gap-2 align-center mt-2">
                        <select id="update-status-select" class="form-control" style="max-width: 200px;">
                            <option value="Pending">Pending</option>
                            <option value="Under Review">Under Review</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                        <button id="btn-update-status" class="btn btn-primary">Update Status</button>
                        <button id="btn-delete" class="btn btn-danger" style="margin-left: auto;">Delete Complaint</button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/citizen.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderComplaintDetails);
    </script>
</body>
</html>
