<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Dashboard - SmartCity Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>SmartCity</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="citizen-dashboard.html" class="nav-item active">Dashboard</a>
            <a href="submit-complaint.html" class="nav-item">Submit Complaint</a>
            <a href="my-complaints.html" class="nav-item">My Complaints</a>
            <a href="profile.html" class="nav-item">Profile</a>
            <a href="#" class="nav-item" onclick="logout()">Logout</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
            <div id="header-user-name" style="font-weight: 600;">Hello, Citizen</div>
        </header>

        <div class="content-area">
            <div class="flex justify-between align-center mb-3">
                <h2>Dashboard</h2>
                <div class="flex gap-1">
                    <a href="submit-complaint.html" class="btn btn-primary">Submit Complaint</a>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Total Complaints</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
                <div class="stat-card pending">
                    <div class="stat-title">Pending</div>
                    <div class="stat-value" id="stat-pending">0</div>
                </div>
                <div class="stat-card progress">
                    <div class="stat-title">In Progress</div>
                    <div class="stat-value" id="stat-progress">0</div>
                </div>
                <div class="stat-card resolved">
                    <div class="stat-title">Resolved</div>
                    <div class="stat-value" id="stat-resolved">0</div>
                </div>
            </div>

            <!-- Recent Complaints -->
            <div class="card">
                <h3>Recent Complaints</h3>
                <div class="table-responsive mt-2">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recent-complaints-body">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
                <div class="mt-2 text-center">
                    <a href="my-complaints.html" class="btn btn-outline">View All My Complaints</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/citizen.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderCitizenDashboard);
    </script>
</body>
</html>
