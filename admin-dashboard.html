<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SmartCity Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>SmartCity Admin</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="admin-dashboard.html" class="nav-item active">Dashboard</a>
            <a href="all-complaints.html" class="nav-item">All Complaints</a>
            <a href="profile.html" class="nav-item">Profile</a>
            <a href="#" class="nav-item" onclick="logout()">Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
            <div id="header-user-name" style="font-weight: 600;">Hello, Admin</div>
        </header>

        <div class="content-area">
            <h2 class="mb-3">Admin Dashboard</h2>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Total Complaints</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
                <div class="stat-card pending">
                    <div class="stat-title">Pending</div>
                    <div class="stat-value" id="stat-pending">0</div>
                </div>
                <div class="stat-card review">
                    <div class="stat-title">Under Review</div>
                    <div class="stat-value" id="stat-review">0</div>
                </div>
                <div class="stat-card progress">
                    <div class="stat-title">In Progress</div>
                    <div class="stat-value" id="stat-progress">0</div>
                </div>
                <div class="stat-card resolved">
                    <div class="stat-title">Resolved</div>
                    <div class="stat-value" id="stat-resolved">0</div>
                </div>
            </div>

            <!-- Recent Complaints -->
            <div class="card">
                <div class="flex justify-between align-center mb-2">
                    <h3>Recent Complaints</h3>
                    <a href="all-complaints.html" class="btn btn-outline" style="padding: 0.5rem 1rem;">View All</a>
                </div>
                
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recent-complaints-body">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderAdminDashboard);
    </script>
</body>
</html>
