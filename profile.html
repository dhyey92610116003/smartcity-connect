<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SmartCity Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>SmartCity</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="#" id="profile-back-btn" class="nav-item">Dashboard</a>
            <a href="profile.html" class="nav-item active">Profile</a>
            <a href="#" class="nav-item" onclick="logout()">Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
            <div id="header-user-name" style="font-weight: 600;">Hello, User</div>
        </header>

        <div class="content-area">
            <h2 class="mb-3">My Profile</h2>

            <div class="card" style="max-width: 500px;">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div style="width: 100px; height: 100px; background: var(--primary-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 1rem auto;">
                        👤
                    </div>
                    <h3 id="profile-name">Name</h3>
                    <p style="color: var(--text-muted);" id="profile-role">Role</p>
                </div>

                <div style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
                    <p><strong>Username:</strong> <span id="profile-username"></span></p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/citizen.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', renderProfile);
    </script>
</body>
</html>
