<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCity Connect - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <h1>SmartCity Connect</h1>
            <p style="color: var(--text-muted); margin-top: 10px;">Smart City Complaint Management Portal</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <div class="demo-credentials">
            <strong>Demo Credentials:</strong><br><br>
            <em>Citizen</em><br>
            User: citizen | Pass: citizen123<br><br>
            <em>Admin</em><br>
            User: admin | Pass: admin123
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Redirect if already logged in
        const user = getCurrentUser();
        if (user) {
            window.location.href = user.role === 'admin' ? 'admin-dashboard.html' : 'citizen-dashboard.html';
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const userVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;
            
            const res = login(userVal, passVal);
            if (res.success) {
                window.location.href = res.role === 'admin' ? 'admin-dashboard.html' : 'citizen-dashboard.html';
            } else {
                showToast(res.message, 'error');
            }
        });
    </script>
</body>
</html>
